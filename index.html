<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おうちごはん 体験版（ユーザーテスト用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F2F3F5;font-family:'Zen Kaku Gothic New',sans-serif;color:#222;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:#222}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#FFFDF6;display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{box-shadow:0 0 0 1px #E5E5E5,0 10px 40px rgba(0,0,0,.08)}}
.content{flex:1;padding:0 16px 24px;display:flex;flex-direction:column;gap:16px}
.hdr{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hdr small{display:block;font-size:12px;color:#555;margin-bottom:4px}
.hdr h1{margin:0;font-size:20px;font-weight:700;line-height:1.4}
.subhdr{padding:12px 8px 8px;display:flex;align-items:center;gap:4px}
.subhdr h1{margin:0;font-size:18px;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #EEE;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back{border:none;background:transparent}
.card{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h2{margin:0;font-size:16px;font-weight:700;line-height:1.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#555;font-size:12px}
.p{margin:0;font-size:14px;line-height:1.7}
.dot{width:8px;height:8px;border-radius:4px;background:#FC700A;display:inline-block;flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 10px;border-radius:999px;background:#E3F7FE;line-height:1.5}
.chip.al{background:#FFEDE2;font-weight:700}
.chip.ok{background:#EAF6E0;color:#3D6B1E}
.chip.y{background:#FFD239;font-weight:700}
.chip.k{background:#222;color:#fff;font-weight:700}
.chip.c{background:#FFF5D4}
.btn{min-height:52px;border-radius:999px;border:none;background:#222;color:#fff;font-size:15px;font-weight:700;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sm{min-height:46px;font-size:14px}
.btn.ghost{background:#fff;color:#222;border:1.5px solid #222}
.btn.block{width:100%}
.photo{border-radius:14px;background:#FFF5D4;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;text-align:center}
.kids{display:grid;gap:8px;padding:0 16px 12px}
.kid{min-height:56px;border-radius:16px;border:2px solid #EEE;background:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px;text-align:left;cursor:pointer}
.kid[aria-selected=true]{border-color:#222}
.av{width:32px;height:32px;border-radius:16px;background:#FFF5D4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.kid[aria-selected=true] .av{background:#FFD239}
.kid b{display:block;font-size:13px}
.kid span.s{font-size:10px;color:#555}
.nutr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;border-top:1px solid #EEE;padding-top:12px}
.nutr b{display:block;font-size:17px}
.nutr span{font-size:11px;color:#555}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#FFF5D4;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:22px}
.banner{background:#FFD239;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:none;text-align:left;width:100%}
.banner .t{font-size:18px;font-weight:700;line-height:1.4}
.banner .d{font-size:13px;line-height:1.6;color:#444}
.list{display:flex;flex-direction:column;gap:10px}
.dish{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;border:none;width:100%;text-align:left;cursor:pointer}
.dish .ph{width:64px;height:64px;flex-shrink:0;border-radius:14px}
.dish b{font-size:15px;display:block;margin-bottom:6px}
.pr{background:#fff;border:1px dashed #DDD;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.prtag{border:1px solid #555;border-radius:4px;padding:0 6px;font-size:11px;font-weight:700;color:#555}
.alert{background:#FFEDE2;border:1px solid #FFD3BC;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;display:flex;gap:10px}
.tabs{display:grid;gap:6px}
.tab{min-height:44px;border-radius:12px;border:1.5px solid #DDD;background:#fff;font-size:13px;cursor:pointer;padding:4px}
.tab[aria-selected=true]{background:#222;border-color:#222;color:#fff;font-weight:700}
.ratio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.ratio div{background:#FFF5D4;border-radius:12px;padding:10px 4px}
.ratio b{display:block;font-size:22px}
ul.ing{margin:0;padding:0;list-style:none;font-size:14px}
ul.ing li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #EEE}
ul.ing li:last-child{border-bottom:none}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.7}
ol.steps li{display:flex;gap:10px}
.num{width:24px;height:24px;flex-shrink:0;border-radius:12px;background:#FFD239;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.check{display:flex;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid #F2F3F5;cursor:pointer}
.check input{width:22px;height:22px;accent-color:#222;margin:0;flex-shrink:0}
.check .n{flex:1;font-size:14px;display:flex;justify-content:space-between}
.check.done .n{color:#999;text-decoration:line-through}
.opt{min-height:46px;display:flex;align-items:center;gap:10px;border:1.5px solid #DDD;border-radius:12px;padding:0 12px;font-size:14px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:#222;margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food{min-height:48px;border-radius:12px;border:1.5px solid #DDD;background:#fff;color:#444;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px}
.food[aria-pressed=true]{border:2px solid #FFD239;background:#FFF5D4;color:#222;font-weight:700}
.food:disabled{border-style:dashed;background:#F2F3F5;color:#666;cursor:not-allowed}
.meter{display:flex;gap:3px}
.meter i{width:10px;height:10px;border-radius:5px;background:#EEE;display:block}
.meter i.on{background:#FC700A}
textarea{width:100%;border:1.5px solid #DDD;border-radius:12px;padding:12px;font-size:14px;line-height:1.6;background:#FFFDF6;resize:vertical}
.done{background:#EAF6E0;color:#3D6B1E;border-radius:12px;padding:14px;font-size:14px;font-weight:700;text-align:center}
nav.tabbar{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid #EEE;padding:6px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.tabbar button{min-height:52px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#555;cursor:pointer}
nav.tabbar button svg{padding:3px 14px;box-sizing:content-box;border-radius:999px}
nav.tabbar button[aria-current=page]{color:#222;font-weight:700}
nav.tabbar button[aria-current=page] svg{background:#FFD239}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.testpanel{display:none}
@media (min-width:980px){
 .testpanel{display:flex;position:fixed;left:24px;top:24px;width:240px;flex-direction:column;gap:8px;background:#fff;border-radius:16px;padding:16px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
 .testpanel a{display:block;padding:8px 10px;border-radius:10px;text-decoration:none;background:#F2F3F5}
 .testpanel a.cur{background:#FFD239;font-weight:700}
}
:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
</style>
</head>
<body>
<aside class="testpanel" aria-label="テスト用の家族切り替え">
  <b>テスト用：家族ごとのリンク</b>
  <span class="muted">URLの ?family=家族ID（または #家族ID）で、その家族向けの表示になります（スマホでは非表示）。</span>
  <div id="famlinks" style="display:flex;flex-direction:column;gap:6px"></div>
</aside>
<div class="app" id="app"></div>

<script>
const IC = {
  home:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  pot:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-2 3-2s3 1 3 2"/></svg>',
  cart:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6.2"/></svg>',
  gift:'<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-2-4-6-4-6-1s4 1 6 1c2 0 6 2 6-1s-4-3-6 1z"/></svg>',
  bell:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  back:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  info:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  chev:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---- 家族データ（本番は献立Labo・園児サポートから家族IDで取得） ---- */
const MENU = ['鶏とほうれん草の和風スパゲティ','シーチキンサラダ・プリン・スキムミルク'];
const SNACK = 'おやつ：にんじんおかかおにぎり・パリパリ昆布';
const FAMILIES = {
  tanaka: { last:'田中', school:'ひまわり保育園', adults:2, kids:[
    { id:'yui', name:'ゆい', call:'ゆいちゃん', age:'9ヶ月', cls:'ひよこ組', type:'baby', stage:'後期', enStage:'中期', allergy:['卵'],
      growth:{date:'10/03', h:'69.0 cm', hd:'前月 +0.6cm', w:'7.7 kg', wd:'前月 +0.1kg'} },
    { id:'hana', name:'はな', call:'はなちゃん', age:'2歳', cls:'うさぎ組', type:'infant', allergy:[],
      nutr:{kcal:'406',p:'16.4',f:'8.7',s:'1.5'}, growth:{date:'10/03', h:'[身長]', hd:'前月比', w:'[体重]', wd:'前月比'} },
    { id:'leo', name:'れお', call:'れおくん', age:'3歳', cls:'くま組', type:'toddler', allergy:[],
      nutr:{kcal:'461',p:'19.5',f:'10.8',s:'1.7'}, growth:{date:'10/03', h:'[身長]', hd:'前月比', w:'[体重]', wd:'前月比'} }
  ]},
  sato: { last:'佐藤', school:'ひまわり保育園', adults:2, kids:[
    { id:'sota', name:'そうた', call:'そうたくん', age:'4歳', cls:'きりん組', type:'toddler', allergy:['乳'],
      nutr:{kcal:'415',p:'15.0',f:'10.6',s:'1.5'}, growth:{date:'10/03', h:'[身長]', hd:'前月比', w:'[体重]', wd:'前月比'} },
    { id:'hinata', name:'ひなた', call:'ひなたちゃん', age:'1歳', cls:'りす組', type:'infant', allergy:[],
      nutr:{kcal:'406',p:'16.4',f:'8.7',s:'1.5'}, growth:{date:'10/03', h:'[身長]', hd:'前月比', w:'[体重]', wd:'前月比'} }
  ]},
  suzuki: { last:'鈴木', school:'ひまわり保育園', adults:1, kids:[
    { id:'mei', name:'めい', call:'めいちゃん', age:'7ヶ月', cls:'ひよこ組', type:'baby', stage:'中期', enStage:'中期', allergy:[],
      growth:{date:'10/03', h:'[身長]', hd:'前月比', w:'[体重]', wd:'前月比'} }
  ]}
};

/* ---- 状態 ---- */
const S = { fam:null, famKey:'tanaka', screen:'home', kid:0, rtab:null, surveySent:false, checks:{}, picks:{}, dailySent:{}, sheet:false };

function loadFamily(){
  let q = '';
  try { q = new URLSearchParams(location.search).get('family') || ''; } catch (e) {}
  const h = (location.hash || '').replace('#','');
  S.famKey = FAMILIES[h] ? h : FAMILIES[q] ? q : 'tanaka';
  S.fam = FAMILIES[S.famKey];
  S.kid = 0; S.rtab = null; S.screen = 'home'; S.surveySent = false; S.checks = {}; S.dailySent = {}; S.sheet = false;
  S.picks = {};
  S.fam.kids.forEach(k => { if (k.type==='baby') S.picks[k.id] = {r1:1,v1:1,v2:1,v3:1,v4:1,f1:1,f2:1,f3:1,s1:1,b1:1}; });
  document.title = 'おうちごはん 体験版｜' + S.fam.last + 'さんち';
  renderLinks();
}

/* ---- 共通パーツ ---- */
const fam = () => S.fam;
const kids = () => S.fam.kids;
const babies = () => S.fam.kids.filter(k => k.type==='baby');
const allAllergy = () => [...new Set(S.fam.kids.flatMap(k => k.allergy))];
const portion = k => k.type==='baby' ? '離乳食 ' + k.stage : k.type==='infant' ? '1〜2歳の量' : '3〜5歳の量';
const typeLabel = k => k.type==='baby' ? '離乳' + k.stage : k.age;
const childCount = () => kids().length;

function go(screen, extra){ Object.assign(S, extra||{}); S.screen = screen; S.sheet = false; render(); window.scrollTo(0,0); }

function tabbar(active){
  const t = (id, label, icon) => `<button data-go="${id}" ${active===id?'aria-current="page"':''}>${icon}${label}</button>`;
  return `<nav class="tabbar" aria-label="メインメニュー">${t('home','ホーム',IC.home)}${t('plan','作り置き',IC.pot)}${t('shop','買い物',IC.cart)}${t('gift','プレゼント',IC.gift)}</nav>`;
}
function sub(title, backTo){
  return `<header class="subhdr"><button class="iconbtn back" data-go="${backTo||'home'}" aria-label="戻る">${IC.back}</button><h1>${title}</h1></header>`;
}

/* ---- ホーム ---- */
function home(){
  const f = fam(), k = kids()[S.kid];
  const kidTabs = childCount() > 1 ? `<div class="kids" role="tablist" aria-label="お子さま" style="grid-template-columns:repeat(${childCount()},minmax(0,1fr))">${kids().map((c,i)=>`
      <button class="kid" role="tab" aria-selected="${i===S.kid}" data-kid="${i}"><span class="av" aria-hidden="true">${c.name[0]}</span><span><b>${c.call}</b><span class="s">${c.age}</span></span></button>`).join('')}</div>` : '';
  const allergyChip = k.allergy.length ? `<span class="chip al">${k.allergy.join('・')} 除去中</span>` : '';
  const today = k.type==='baby' ? `
      <div class="photo" style="height:120px">離乳食の写真（園から配信）</div>
      <p class="p">[離乳食 ${k.stage}メニュー]（献立Laboの離乳食データ）</p>`
    : `
      <div class="photo" style="height:120px">給食の写真（園から配信）</div>
      <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px">${MENU.map(m=>`<li>${m}</li>`).join('')}</ul>
      <p style="margin:0;font-size:13px;color:#3D6B1E;font-weight:500">${SNACK}</p>
      <div class="nutr"><div><b>${k.nutr.kcal}</b><span>kcal</span></div><div><b>${k.nutr.p}</b><span>たんぱく質 g</span></div><div><b>${k.nutr.f}</b><span>脂質 g</span></div><div><b>${k.nutr.s}</b><span>塩分 g</span></div></div>`;
  const baby = k.type==='baby' ? `
    <section class="card" style="border:2px solid #FFD239" aria-label="園からの食事記録">
      <div class="row"><h2>園からの食事記録</h2><span class="chip" style="background:#FC700A;font-weight:700">今日の分が届きました</span></div>
      <p class="p" style="font-size:13px;color:#444">昼食はほぼ完食、ミルクは合計360ml。白身魚が園で初めて出ました。</p>
      <div class="grid2" style="gap:8px"><button class="btn sm" data-go="daily">今日の食事を見る</button><button class="btn sm ghost" data-go="food">食材チェック</button></div>
    </section>` : '';
  const toddlerNames = kids().filter(c=>c.type!=='baby').map(c=>c.call);
  const babyNames = babies().map(c=>c.call);
  let planDesc = '';
  if (toddlerNames.length) planDesc += toddlerNames.join('・') + 'の取り分け';
  if (babyNames.length) planDesc += (planDesc?'と、':'') + babyNames.join('・') + 'の離乳食';
  const al = allAllergy();
  planDesc += (al.length ? `（${al.join('・')}なし）` : '') + 'まで、1回の調理で。来週の園ごはんと被らない5品です。';
  const pr = k.type==='baby' ? {to:'離乳食期のご家庭へ', t:'ベビーフードの新しいレシピ、試してみませんか？ モニター募集中'}
           : k.type==='infant' ? {to:'1〜2歳のご家庭へ', t:'朝ごはんのヨーグルト、どう使ってる？ 2分のアンケートでサンプルをプレゼント'}
           : {to:'幼児のご家庭へ', t:'幼児向け調味料のモニター募集。おうちのごはんで使ってみませんか？'};
  return `
  <header class="hdr"><div><small>${f.school}</small><h1>${f.last}さんちのおうちごはん</h1></div><button class="iconbtn" aria-label="お知らせ" data-toast="お知らせ（テスト版では未実装）">${IC.bell}</button></header>
  ${kidTabs}
  <main class="content">
    <section class="card" aria-label="今日の園ごはん">
      <div class="row"><h2 style="display:flex;align-items:center;gap:8px"><span class="dot" aria-hidden="true"></span>${k.call}の今日の園ごはん</h2><span class="muted">11/10（火）</span></div>
      <div class="chips"><span class="chip">${k.cls}</span><span class="chip">${portion(k)}</span>${allergyChip}</div>
      ${today}
    </section>
    ${baby}
    <section class="card" aria-label="成長の記録">
      <div class="row" style="align-items:baseline"><h2>${k.call}の成長の記録</h2><span class="muted">園で測定 ${k.growth.date}</span></div>
      <div class="grid2">
        <div class="stat"><span class="muted">身長</span><b>${k.growth.h}</b><span class="muted" style="font-size:11px">${k.growth.hd}</span></div>
        <div class="stat"><span class="muted">体重</span><b>${k.growth.w}</b><span class="muted" style="font-size:11px">${k.growth.wd}</span></div>
      </div>
    </section>
    <button class="banner" data-go="plan">
      <span class="chip k" style="align-self:flex-start">金曜のおとどけ</span>
      <span class="t">${f.last}さんちの週末作り置きプラン</span>
      <span class="d">${planDesc}</span>
      <span class="btn sm" style="align-self:flex-start">プランを見る</span>
    </button>
    <button class="card" data-go="recipe" style="flex-direction:row;align-items:center;gap:14px;border:none;text-align:left;cursor:pointer">

function howFor(k){
  if (!k) return {when:'仕上げのあとに', how:'お皿に取ったあと、好みでしょうゆや七味を足してください。子どもと同じ鍋のままで大丈夫です。'};

  if (k.type==='infant') return {when:'仕上げの前に', how:`${k.call}は園の1〜2歳と同じく、幼児の8割の量が目安。ひき肉が固まりやすいので、お湯を少し足してしっとりさせます。`};

}

      <h2 style="font-size:14px">現在の提供情報</h2>
      <div class="grid2" style="gap:8px;font-size:13px">
        <div style="display:flex;border:1px solid #DDD;border-radius:8px;overflow:hidden"><span style="background:#F2F3F5;padding:8px 10px;color:#555">園の提供</span><b style="padding:8px 10px">${k.enStage}</b></div>
        <div style="display:flex;border:1px solid #DDD;border-radius:8px;overflow:hidden"><span style="background:#F2F3F5;padding:8px 10px;color:#555">おうち</span><b style="padding:8px 10px">${k.stage}</b></div>
      </div>
      <p class="muted" style="margin:0;line-height:1.6;color:#444">おうちで食べた食材がそろうと、園でも次の段階の献立に進めます。</p>
    </section>
    <section class="card" style="gap:14px">
      <div class="row"><h2>${k.stage}</h2><span class="muted">選択中 ${n}品</span></div>
      <div style="background:#F2F3F5;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:2px">
        ${k.stage==='後期' ? '<b>後期（9〜11か月）の目安</b><span>かたさ：歯ぐきでつぶせるかたさ（バナナくらい）</span><span>大きさ：5〜8mm角が目安</span>' : '<b>中期（7〜8か月）の目安</b><span>かたさ：舌でつぶせるかたさ（豆腐くらい）</span><span>大きさ：2〜3mm角のみじん切りが目安</span>'}
      </div>
      <b style="font-size:14px">おうちで食べた食材をえらんでください</b>
      <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#444"><span><span class="chip" style="font-size:10px;font-weight:700;padding:1px 6px">来週</span> 来週の園で初めて出る</span><span>グレー：アレルギーで除去中</span></div>
      ${G.map(g=>`<div style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:13px;color:#444">${g.t}</h3><div class="fgrid">${g.items.map(([id,l,fl])=>{
          const na = fl==='na';
          return `<button class="food" data-food="${id}" aria-pressed="${!!picks[id] && !na}" ${na?'disabled':''}>${l}${na?'（除去中）':''}${fl==='next'?'<span class="chip" style="font-size:10px;font-weight:700;padding:1px 6px">来週</span>':''}</button>`;
        }).join('')}</div></div>`).join('')}
      <button class="btn block" data-toast="園に送りました（テスト版）">更新して園に送る</button>
    </section>
    <button class="card" data-go="shop" style="border:2px solid #FFD239;text-align:left;cursor:pointer;gap:6px">
      <span style="font-size:12px;font-weight:700;color:#444">baby's fun! 簡単調理キット</span>
      <b style="font-size:16px;line-height:1.5">しらす・鶏ささみの「はじめて」を、園と同じ下ごしらえで</b>
      <span style="font-size:13px;font-weight:700;text-decoration:underline">キットを見る</span>
    </button>
  </main>
  ${tabbar('home')}`;
}

/* ---- 描画 ---- */
const SCREENS = {home, plan, recipe, shop, gift, daily, food};
let toastTimer;
function render(){
  if ((S.screen==='daily' || S.screen==='food') && !babies().length) S.screen = 'home';
  document.getElementById('app').innerHTML = SCREENS[S.screen]();
}
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;z-index:30;max-width:90vw;text-align:center';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.style.display='none'; }, 1800);
}
function renderLinks(){
  const box = document.getElementById('famlinks');
  box.innerHTML = Object.entries(FAMILIES).map(([key,f])=>`<a href="#${key}" class="${key===S.famKey?'cur':''}">#${key}　${f.last}さんち（${f.kids.map(k=>k.name+' '+k.age).join('・')}）</a>`).join('');
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-go],[data-kid],[data-rtab],[data-sheet],[data-close],[data-ordered],[data-survey],[data-daily],[data-food],[data-toast]');
  if (!el) return;
  const d = el.dataset;
  if (d.close !== undefined && e.target !== el && !e.target.closest('button[data-close]')) return;
  if (d.go){ const extra = {}; if (d.go==='daily' || d.go==='food'){ const bi = kids().findIndex(k=>k.type==='baby'); if (kids()[S.kid].type!=='baby' && bi>=0) extra.kid = bi; } go(d.go, extra); return; }
  if (d.kid){ S.kid = +d.kid; render(); return; }
  if (d.rtab){ S.rtab = +d.rtab; render(); return; }
  if (d.sheet){ S.sheet = true; render(); return; }
  if (d.close){ S.sheet = false; render(); return; }
  if (d.ordered){ S.sheet = false; render(); toast('ご注文ありがとうございました（テスト版）'); return; }
  if (d.survey){ S.surveySent = true; render(); return; }
  if (d.daily){ S.dailySent[d.daily] = true; render(); return; }
  if (d.food){ const k = kids()[S.kid].type==='baby' ? kids()[S.kid] : babies()[0]; const p = S.picks[k.id]; if (p[d.food]) delete p[d.food]; else p[d.food]=1; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if (d.toast){ toast(d.toast); }
});
document.addEventListener('change', e=>{
  const id = e.target.dataset && e.target.dataset.check;
  if (id){ S.checks[id] = e.target.checked; const y = window.scrollY; render(); window.scrollTo(0,y); }
});
window.addEventListener('hashchange', ()=>{ loadFamily(); render(); window.scrollTo(0,0); });
loadFamily(); render();
</script>
</body>
</html>
